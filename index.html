<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panama AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Planificador de Viaje</h1>

  <form id="travelForm">
    <label>Destino:</label>
    <input type="text" id="destination" required><br><br>

    <label>Días:</label>
    <input type="number" id="days" required><br><br>

    <label>Presupuesto:</label>
    <input type="number" id="budget" required><br><br>

    <label>Interés:</label>
    <input type="checkbox" value="playa"> Playa<br>

    <button type="submit">Crear itinerario</button>
  </form>

  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
